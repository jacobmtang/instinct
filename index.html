<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instinct</title>
<meta name="description" content="Instinct is a personal assistant that understands your work and takes action across your applications and devices.">
<!-- Concept mockup: keep out of search until Instinct adopts it. Remove at handover. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4efec">
<!-- Free stand-ins for the live site: Fraunces (for Season Mix) and Instrument Sans (for GT America) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<main class="stage">
  <h1 class="sr-only">Instinct, a personal assistant you text</h1>
  <a class="wordmark" href="./" aria-label="Instinct home"><img src="assets/img/wordmark.svg" alt="Instinct" width="105" height="26"></a>
  <figure class="hand">
    <div class="screen">
      <video src="assets/video/closet-demo.mp4" poster="assets/img/closet-demo-poster.jpg" autoplay muted loop playsinline preload="auto" aria-label="Screen recording: asking Instinct over iMessage to make a closet from photos"></video>
    </div>
    <img src="assets/img/hand-mockup.webp" alt="A hand holding an iPhone">
  </figure>
  <a class="cta" href="https://app.instinct.com/login">Text Instinct</a>
</main>
<script>
  // Respect reduced motion: show the poster frame instead of playing.
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { const v = document.querySelector('.screen video'); v.removeAttribute('autoplay'); v.pause(); }
</script>
</body>
</html>
